<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Nihar Ranjan Sahoo</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .notfound { max-width: 560px; margin: 18vh auto 0; padding: 0 1.25rem; text-align: center; }
    .notfound h1 { font-size: 1.6rem; color: var(--text-strong); margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <main class="notfound">
    <h1>Page not found</h1>
    <p>This site was redesigned and older pages have moved. Everything now lives on the <a href="/">homepage</a>.</p>
  </main>
</body>
</html>
